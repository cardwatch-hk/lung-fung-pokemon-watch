name: Lung Fung Pokemon Watch
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Create one deduplicated TEST issue to verify GitHub email'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: lung-fung-watch
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified official tag
        with:
          python-version: '3.12'
      - name: Install small pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check shop and deliver pending notifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python monitor.py --test-alert
          else
            python monitor.py
          fi
